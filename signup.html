<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Datalyze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="header-inner">
          <div class="brand">
            <span class="brand-mark">D</span>
            <div class="brand-text">
              <span class="brand-name">Datalyze</span>
              <span class="brand-tag">Analytics & Growth</span>
            </div>
          </div>
          <nav class="site-nav">
            <a href="/index">Home</a>
            <a href="/about">About</a>
            <a href="/services">Services</a>
            <a href="/tools">Tools</a>
            <a href="/case-studies/">Case Studies</a>
            <a href="/resources">Resources</a>
            <a href="/faqs">FAQs</a>
            <a href="/contact">Contact</a>
            <a href="/signin">Sign In</a>
            <a class="btn pill" href="/contact">Book Audit</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="section">
          <div class="container auth-shell">
            <div class="auth-card">
              <div class="auth-logo" aria-hidden="true">
                <span></span>
              </div>
              <p class="eyebrow">Account access</p>
              <h1>Create your account</h1>

              <p class="tool-access-note">
                Accessing <span class="tool-access-name" id="tool-name">Datalyze tools</span>
              </p>

              <form class="auth-form" id="signup-form">
                <div class="auth-field">
                  <label class="auth-label" for="signup-full-name">Full Name</label>
                  <input
                    class="auth-input"
                    id="signup-full-name"
                    type="text"
                    name="fullName"
                    autocomplete="name"
                    placeholder="John Doe"
                    required
                  />
                </div>
                <div class="auth-field">
                  <label class="auth-label" for="signup-email">Email address</label>
                  <input
                    class="auth-input"
                    id="signup-email"
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@company.com"
                    required
                  />
                </div>
                <div class="auth-field">
                  <label class="auth-label" for="signup-password">Password</label>
                  <input
                    class="auth-input"
                    id="signup-password"
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <button class="btn auth-cta" type="submit">Create account</button>
                <p class="auth-switch">
                  Already have an account? <a href="/signin" id="signin-link">Sign in</a>
                </p>
              </form>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer" data-site-footer data-footer-variant="primary"></footer>
    </div>
    <script type="module" src="/src/auth.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
