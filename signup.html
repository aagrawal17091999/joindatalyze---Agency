<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Datalyze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card-minimal">
        <div class="auth-logo-minimal" aria-hidden="true">
          <span></span>
        </div>
        <h1 class="auth-title">Create your account</h1>

        <form class="auth-form-minimal" id="signup-form">
          <div class="auth-field-minimal">
            <label class="auth-label-minimal" for="signup-full-name">Full Name</label>
            <input
              class="auth-input-minimal"
              id="signup-full-name"
              type="text"
              name="fullName"
              autocomplete="name"
              placeholder="John Doe"
              required
            />
          </div>
          <div class="auth-field-minimal">
            <label class="auth-label-minimal" for="signup-email">Email address</label>
            <input
              class="auth-input-minimal"
              id="signup-email"
              type="email"
              name="email"
              autocomplete="email"
              placeholder="you@company.com"
              required
            />
          </div>
          <div class="auth-field-minimal">
            <label class="auth-label-minimal" for="signup-password">Password</label>
            <input
              class="auth-input-minimal"
              id="signup-password"
              type="password"
              name="password"
              autocomplete="new-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button class="auth-btn-minimal" type="submit">Create account</button>
          <p id="auth-status" class="auth-status-minimal"></p>
          <p class="auth-policy-minimal">
            Read our <a href="/privacy">Privacy Policy</a> and <a href="/terms">Terms of Service</a>.
          </p>
          <p class="auth-switch-minimal">
            Already have an account? <a href="/signin" id="signin-link">Sign in</a>
          </p>
        </form>
      </div>
    </div>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
